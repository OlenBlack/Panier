
name: Get Android SHA1

on:
  workflow_dispatch:

jobs:
  sha1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Give permission
        run: chmod +x gradlew

      - name: Get SHA1
        run: ./gradlew signingReport
