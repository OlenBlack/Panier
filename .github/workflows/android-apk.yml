
name: Build Mon Panier V2.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Vérifier AndroidManifest.xml
        run: |
          echo "Branche actuelle :"
          git branch --show-current

          echo "Fichiers Manifest suivis par Git :"
          git ls-files | grep -i 'AndroidManifest.xml' || true

          echo "Contenu du dossier app/src/main :"
          ls -la app/src/main/

          echo "Vérification du chemin exact :"
          git ls-files --error-unmatch app/src/main/AndroidManifest.xml
          test -f app/src/main/AndroidManifest.xml

      - name: Compiler Mon Panier
        run: gradle --no-daemon :app:assembleDebug

      - name: Récupérer le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Panier-V2.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

